# SmartShule — Configuration Render Blueprint
# ============================================================
# Déploiement Next.js + PostgreSQL Supabase
# Voir : https://render.com/docs/blueprint-spec
#
# ⚠️ Note : Render ne supporte pas SQLite en persistant sans disque payant.
#    En production, PRÉFÉRER Railway + Supabase PostgreSQL.
# ============================================================

services:
  - type: web
    name: smartshule
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: |
      npm install --include=dev &&
      npx prisma generate &&
      next build &&
      cp -r .next/static .next/standalone/.next/ &&
      cp -r public .next/standalone/
    startCommand: |
      mkdir -p db &&
      npx prisma db push --accept-data-loss &&
      bun .next/standalone/server.js
    healthCheckPath: /api/health
    healthCheckTimeout: 30s
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # À configurer manuellement (valeur secrète)
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://smartshule.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://smartshule.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: IDEMPOTENCY_TTL_HOURS
        value: "24"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartshule.onrender.com,https://smartshule.pages.dev,http://localhost:3000"
      - key: CURRENCY
        value: CDF
      - key: LOCALE
        value: fr-FR
      - key: TIMEZONE
        value: Africa/Kinshasa
      - key: PORT
        value: "10000"
