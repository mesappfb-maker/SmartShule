# SmartShule — Configuration Render Blueprint
# ============================================================
# Déploiement Next.js + PostgreSQL Supabase
# Voir : https://render.com/docs/blueprint-spec
#
# ✅ Optimisé pour PostgreSQL Supabase (pas SQLite)
# ✅ Build standalone avec copy static + public
# ✅ Prisma db push au démarrage (création auto des tables)
# ✅ Auto-seed si la base est vide (comptes démo)
# ============================================================

services:
  - type: web
    name: smartshule
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: |
      npm install --include=dev &&
      npx prisma generate &&
      next build &&
      cp -r .next/static .next/standalone/.next/ &&
      cp -r public .next/standalone/
    startCommand: |
      npx prisma db push --accept-data-loss &&
      node scripts/auto-seed.js &&
      bun .next/standalone/server.js
    healthCheckPath: /api/health
    healthCheckTimeout: 60s
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # ⚠️ À configurer manuellement (Supabase pooler URL)
      - key: DIRECT_URL
        sync: false  # ⚠️ À configurer manuellement (Supabase direct URL)
      - key: NEXTAUTH_SECRET
        sync: false  # ⚠️ À configurer manuellement (openssl rand -base64 32)
      - key: NEXTAUTH_URL
        value: https://smartshule.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://smartshule.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: IDEMPOTENCY_TTL_HOURS
        value: "24"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartshule.onrender.com,https://smartshule.pages.dev,http://localhost:3000"
      - key: CURRENCY
        value: CDF
      - key: LOCALE
        value: fr-FR
      - key: TIMEZONE
        value: Africa/Kinshasa
      - key: PORT
        value: "10000"
